<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Agent Software Stack 七层软件栈</title>
  <desc id="desc">Agent Platform 的七层软件栈，以及每一层回答的核心问题。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#173a7a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="92" y="82" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="700" fill="#172033">Agent Software Stack</text>
  <text x="92" y="126" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#5f6b82">七层软件栈：从真实世界到业务目标，每一层只回答一个核心问题</text>

  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" filter="url(#shadow)">
    <g><rect x="110" y="190" width="1030" height="90" rx="18" fill="#1d46ae"/><text x="145" y="228" font-size="20" font-weight="700" fill="#dce7ff">L7</text><text x="205" y="230" font-size="27" font-weight="700" fill="#fff">业务 / 产品</text><text x="205" y="260" font-size="16" fill="#dce7ff">Goal · Project · Business Task · Requirement</text></g>
    <g><rect x="110" y="292" width="1030" height="90" rx="18" fill="#2c5fd1"/><text x="145" y="330" font-size="20" font-weight="700" fill="#e4ecff">L6</text><text x="205" y="332" font-size="27" font-weight="700" fill="#fff">能力契约</text><text x="205" y="362" font-size="16" fill="#e4ecff">Acceptance · Quality · Evaluation Contract · Evidence</text></g>
    <g><rect x="110" y="394" width="1030" height="90" rx="18" fill="#4c7df0"/><text x="145" y="432" font-size="20" font-weight="700" fill="#edf3ff">L5</text><text x="205" y="434" font-size="27" font-weight="700" fill="#fff">能力工程</text><text x="205" y="464" font-size="16" fill="#edf3ff">Skill · Tool · Capability Catalog · Discovery · MCP Binding</text></g>
    <g><rect x="110" y="496" width="1030" height="90" rx="18" fill="#ffffff" stroke="#a9c0f0" stroke-width="2"/><text x="145" y="534" font-size="20" font-weight="700" fill="#315cbe">L4</text><text x="205" y="536" font-size="27" font-weight="700" fill="#172033">执行策略</text><text x="205" y="566" font-size="16" fill="#5e6c85">Direct · Workflow · Agent Loop · PTC · Multi-Agent · Harness</text></g>
    <g><rect x="110" y="598" width="1030" height="90" rx="18" fill="#172033"/><text x="145" y="636" font-size="20" font-weight="700" fill="#d5dbea">L3</text><text x="205" y="638" font-size="27" font-weight="700" fill="#fff">统一运行时</text><text x="205" y="668" font-size="16" fill="#cbd5e8">Work · Session · Run · Event · State · Action · Observation · Artifact</text></g>
    <g><rect x="110" y="700" width="1030" height="90" rx="18" fill="#ffffff" stroke="#c8d7ef" stroke-width="2"/><text x="145" y="738" font-size="20" font-weight="700" fill="#61708a">L2</text><text x="205" y="740" font-size="27" font-weight="700" fill="#172033">Agent Work Environment</text><text x="205" y="770" font-size="16" fill="#5e6c85">Workspace · Execution · Verification · Capability Proxy · Sandbox</text></g>
    <g><rect x="110" y="802" width="1030" height="90" rx="18" fill="#eef2f7" stroke="#d9e0ea" stroke-width="2"/><text x="145" y="840" font-size="20" font-weight="700" fill="#6d7789">L1</text><text x="205" y="842" font-size="27" font-weight="700" fill="#172033">基础设施 / 真实世界</text><text x="205" y="872" font-size="16" fill="#667187">API · SaaS · DB · Browser · Files · Compute · Network · Devices</text></g>
  </g>

  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="1220" y="190" font-size="19" font-weight="700" fill="#33415b">每层回答一个问题</text>
    <g font-size="18" fill="#506079">
      <text x="1220" y="242">要完成什么？</text>
      <text x="1220" y="344">什么叫真正具备能力？</text>
      <text x="1220" y="446">Agent 可以学什么、做什么？</text>
      <text x="1220" y="548">当前任务怎么推进？</text>
      <text x="1220" y="650">实际上发生了什么？</text>
      <text x="1220" y="752">Agent 能作用于什么世界？</text>
      <text x="1220" y="854">真正的资源在哪里？</text>
    </g>
    <rect x="1188" y="900" width="318" height="44" rx="12" fill="#e8efff"/>
    <text x="1347" y="928" text-anchor="middle" font-size="16" font-weight="700" fill="#315cbe">横向：Context · Eval · Trace · Security · Cost</text>
  </g>
</svg>