name: Docs

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.vitepress/**'
      - 'diagrams/**/*.architecture.json'
      - 'scripts/render-archify.sh'
      - 'package.json'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.vitepress/**'
      - 'diagrams/**/*.architecture.json'
      - 'scripts/render-archify.sh'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Checkout Archify
        run: git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify

      - name: Validate and render diagrams
        run: bash scripts/render-archify.sh

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build documentation
        run: npm run docs:build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
