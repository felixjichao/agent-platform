name: Validate Architecture Docs

on:
  push:
    paths:
      - 'diagrams/**/*.architecture.json'
      - 'architecture/**/*.md'
      - '.vitepress/**'
      - 'index.md'
      - 'scripts/render-archify.sh'
      - 'package.json'
      - '.github/workflows/render-archify-mvp.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Platform
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Checkout Archify
        run: git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify

      - name: Validate and render Archify diagrams
        run: bash scripts/render-archify.sh

      - name: Install documentation dependencies
        run: npm install --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      - name: Commit rendered artifacts
        shell: bash
        run: |
          git add public/diagrams
          if git diff --cached --quiet; then
            echo "Archify outputs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render Archify diagrams"
          git push
