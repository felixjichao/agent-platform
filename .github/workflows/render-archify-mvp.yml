name: Render Archify Diagrams

on:
  push:
    branches:
      - main
      - feat/visual-architecture-mvp
    paths:
      - 'diagrams/**/*.architecture.json'
      - .github/workflows/render-archify-mvp.yml

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Platform
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Archify
        run: git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify

      - name: Validate and render Archify diagrams
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sources < <(find diagrams -type f -name '*.architecture.json' | sort)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No Archify architecture sources found."
            exit 0
          fi

          for source in "${sources[@]}"; do
            relative="${source#diagrams/}"
            output="public/diagrams/${relative%.json}.html"
            mkdir -p "$(dirname "$output")"

            echo "::group::Archify $source"
            node /tmp/archify/archify/bin/archify.mjs validate architecture "$source" --quality showcase --repo-root . --json
            node /tmp/archify/archify/bin/archify.mjs deliver architecture "$source" "$output" --quality showcase --repo-root . --json
            echo "::endgroup::"
          done

      - name: Commit rendered artifacts
        shell: bash
        run: |
          git add public/diagrams
          if git diff --cached --quiet; then
            echo "Archify outputs are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render Archify diagrams"
          git push
